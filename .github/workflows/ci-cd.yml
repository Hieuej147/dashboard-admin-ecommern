name: Build and Deploy Admin Dashboard

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write   # AWS OIDC authentication
  contents: read

jobs:
  lint-and-build:
    name: Build & Verify SPA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build SPA
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY || 'pk_test_dummy' }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://api.yourdomain.com/v1' }}
          VITE_STOREFRONT_URL: ${{ secrets.VITE_STOREFRONT_URL || 'https://store.yourdomain.com' }}
        run: bun run build

  deploy-container:
    name: Build Docker & Push ECR (Deploy to Amazon EKS)
    needs: lint-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-southeast-1' }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY || 'prod-ecommerce-admin-dashboard' }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --build-arg VITE_CLERK_PUBLISHABLE_KEY=${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }} \
            --build-arg VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL || 'https://api.hieudev.click/v1' }} \
            --build-arg VITE_STOREFRONT_URL=${{ secrets.VITE_STOREFRONT_URL || 'https://store.hieudev.click' }} \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy to Amazon EKS (Rolling Restart)
        run: |
          aws eks update-kubeconfig --region ${{ secrets.AWS_REGION || 'ap-southeast-1' }} --name ${{ secrets.EKS_CLUSTER_NAME || 'ecommerce' }}
          kubectl scale deployment/admin-dashboard --replicas=1 -n ecommerce
          kubectl rollout restart deployment/admin-dashboard -n ecommerce
          kubectl rollout status deployment/admin-dashboard -n ecommerce --timeout=300s
